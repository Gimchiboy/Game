<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#272c28">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&family=Jost:wght@300;400;500&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
/* ======== theme tokens ======== */
:root, html[data-theme="paper"]{
  --shell:#f3f0e8; --shell-2:#ebe7dd; --shell-3:#dfdacd; --shell-ink:#111111; --shell-muted:#6b6862;
  --page-img:var(--grain);
  --lcd:#f8f6f0; --lcd-2:#ebe7de; --lcd-3:#e2ddd2; --ink:#111111; --muted:#5f5c56; --line:rgba(17,17,17,.13);
  --bezel:#d9d4c7; --card-bw:1px; --card-shadow:0 1px 0 rgba(0,0,0,.025); --card-img:var(--grain); --radius:8px;
  --amber:#111111; --amber-ink:#f6f4ee; --amber-low:transparent; --accent:#111111;
  --key-bg:#e6e1d5; --key-ink:#111; --key-border:transparent; --key-shadow:none; --key-radius:999px;
  --chip-bg:transparent; --chip-border:#c9c3b5; --chip-ink:#4c4a45; --chip-radius:999px;
  --nav-bg:rgba(243,240,232,.94); --nav-border:#d9d4c7; --nav-on:#111; --nav-on-bg:transparent;
  --head:"Zen Kaku Gothic New", system-ui, sans-serif; --head-size:30px; --head-weight:500; --head-case:none; --head-track:.02em;
  --pix:"DM Mono", ui-monospace, monospace; --mono:"Zen Kaku Gothic New", system-ui, sans-serif;
  --label-track:.22em; --label-size:11px;
  --check-radius:3px; --cell-radius:999px; --tank-radius:999px; --tank-bw:1.5px;
  --work:#2d5ca8; --life:#a0501a; --warn:#9a2f12; --warn-soft:#f1d9cd;
  --sheet-bg:#f6f3ec; --field-bg:#fbfaf6; --field-border:#cfc9bb; --toast-bg:#111; --toast-ink:#f6f4ee;
  --scan:none;
}
html[data-theme="kraft"]{
  --shell:#d8c6a6; --shell-2:#cdb995; --shell-3:#c2ad87; --shell-ink:#2a1f15; --shell-muted:#55422f;
  --page-img:var(--speckle), var(--grain);
  --lcd:rgba(250,242,226,.28); --lcd-2:rgba(255,248,235,.45); --lcd-3:rgba(42,31,21,.12); --ink:#2a1f15; --muted:#5e4b37; --line:rgba(42,31,21,.18);
  --bezel:rgba(42,31,21,.28); --card-bw:1px; --card-shadow:none; --card-img:none; --radius:3px;
  --amber:#2a1f15; --amber-ink:#efe3cc; --amber-low:transparent; --accent:#2a1f15;
  --key-bg:transparent; --key-ink:#2a1f15; --key-border:rgba(42,31,21,.45); --key-shadow:none; --key-radius:999px;
  --chip-bg:transparent; --chip-border:rgba(42,31,21,.35); --chip-ink:#4a3a2a; --chip-radius:999px;
  --nav-bg:rgba(216,198,166,.95); --nav-border:rgba(42,31,21,.25); --nav-on:#2a1f15; --nav-on-bg:transparent;
  --head:"Jost", system-ui, sans-serif; --head-size:20px; --head-weight:400; --head-case:uppercase; --head-track:.32em;
  --pix:"Jost", system-ui, sans-serif; --mono:"Jost", system-ui, sans-serif;
  --label-track:.3em; --label-size:11px;
  --check-radius:50%; --cell-radius:999px; --tank-radius:999px; --tank-bw:1px;
  --work:#2a55a0; --life:#8f3f10; --warn:#7f2410; --warn-soft:rgba(143,63,16,.15);
  --sheet-bg:#e3d4b8; --field-bg:rgba(255,250,240,.55); --field-border:rgba(42,31,21,.35); --toast-bg:#2a1f15; --toast-ink:#efe3cc;
  --scan:none;
}
html[data-theme="sage"]{
  --shell:#e8eee2; --shell-2:#dfe7d7; --shell-3:#d3dccb; --shell-ink:#1d201c; --shell-muted:#5a6056;
  --page-img:var(--grain);
  --lcd:transparent; --lcd-2:#dde5d4; --lcd-3:#d1dbc8; --ink:#1d201c; --muted:#525850; --line:rgba(29,32,28,.25);
  --bezel:#1d201c; --card-bw:1.5px; --card-shadow:none; --card-img:none; --radius:26px;
  --amber:#1d201c; --amber-ink:#e8eee2; --amber-low:transparent; --accent:#1d201c;
  --key-bg:transparent; --key-ink:#1d201c; --key-border:#1d201c; --key-shadow:none; --key-radius:999px;
  --chip-bg:transparent; --chip-border:#1d201c; --chip-ink:#1d201c; --chip-radius:999px;
  --nav-bg:rgba(232,238,226,.95); --nav-border:#1d201c; --nav-on:#1d201c; --nav-on-bg:transparent;
  --head:"Space Grotesk", system-ui, sans-serif; --head-size:34px; --head-weight:400; --head-case:none; --head-track:-.01em;
  --pix:"Space Grotesk", system-ui, sans-serif; --mono:"Space Mono", ui-monospace, monospace;
  --label-track:.04em; --label-size:12px;
  --check-radius:6px; --cell-radius:2px; --tank-radius:999px; --tank-bw:1.5px;
  --work:#2d5ca8; --life:#a0501a; --warn:#8f2a10; --warn-soft:#f0d6c8;
  --sheet-bg:#e8eee2; --field-bg:#f1f5ec; --field-border:#1d201c; --toast-bg:#1d201c; --toast-ink:#e8eee2;
  --scan:none;
}
html[data-theme="handheld"]{
  --shell:#272c28; --shell-2:#30362f; --shell-3:#3a413a; --shell-ink:#eceee3; --shell-muted:#a7ae9e;
  --page-img:radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 1.5px);
  --lcd:#c6d0b3; --lcd-2:#b8c3a5; --lcd-3:#a9b595; --ink:#1c2519; --muted:#4b5743; --line:rgba(28,37,25,.2);
  --bezel:#121512; --card-bw:3px; --card-shadow:inset 0 2px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.08), 0 0 0 2px #3a413a, 0 4px 0 2px #0c0e0c;
  --card-img:repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0 1px, transparent 1px 3px); --radius:12px;
  --amber:#e9a53a; --amber-ink:#2a1d05; --amber-low:#8a5a12; --accent:#2c4a26;
  --key-bg:#3a413a; --key-ink:#eceee3; --key-border:transparent; --key-shadow:0 3px 0 #0d0f0d; --key-radius:8px;
  --chip-bg:#30362f; --chip-border:#454c45; --chip-ink:#a7ae9e; --chip-radius:7px;
  --nav-bg:#30362f; --nav-border:#121512; --nav-on:#e9a53a; --nav-on-bg:#3a413a;
  --head:"Silkscreen", ui-monospace, monospace; --head-size:26px; --head-weight:400; --head-case:none; --head-track:.01em;
  --pix:"Silkscreen", ui-monospace, monospace; --mono:"IBM Plex Mono", ui-monospace, monospace;
  --label-track:.06em; --label-size:11px;
  --check-radius:3px; --cell-radius:2px; --tank-radius:6px; --tank-bw:2px;
  --work:#2d5ca8; --life:#a0501a; --warn:#8f2f0e; --warn-soft:#e2c3ad;
  --sheet-bg:#30362f; --field-bg:#c6d0b3; --field-border:#121512; --toast-bg:#121512; --toast-ink:#c6d0b3;
}

html[data-theme="ledger"]{
  --shell:#f6f4ee; --shell-2:#ebe8df; --shell-3:#dfe3ea; --shell-ink:#1c2742; --shell-muted:#4d5873;
  --page-img:repeating-linear-gradient(0deg, rgba(60,100,170,.13) 0 1px, transparent 1px 24px), repeating-linear-gradient(90deg, rgba(60,100,170,.13) 0 1px, transparent 1px 24px);
  --lcd:#fffefa; --lcd-2:#f1f3f7; --lcd-3:#e2e7ef; --ink:#1c2742; --muted:#4d5873; --line:rgba(28,39,66,.14);
  --bezel:#c5cfdf; --card-bw:1px; --card-shadow:inset 3px 0 0 #d9534f, 0 1px 0 rgba(28,39,66,.06); --card-img:none; --radius:4px;
  --amber:#1c2742; --amber-ink:#fffefa; --amber-low:transparent; --accent:#1c2742;
  --key-bg:#e6eaf1; --key-ink:#1c2742; --key-border:transparent; --key-shadow:none; --key-radius:6px;
  --chip-bg:#fffefa; --chip-border:#c5cfdf; --chip-ink:#3d4865; --chip-radius:6px;
  --nav-bg:rgba(246,244,238,.96); --nav-border:#c5cfdf; --nav-on:#1c2742; --nav-on-bg:transparent;
  --head:"Fraunces", Georgia, serif; --head-size:32px; --head-weight:500; --head-case:none; --head-track:-.01em;
  --pix:"IBM Plex Mono", ui-monospace, monospace; --mono:"IBM Plex Sans", system-ui, sans-serif;
  --label-track:.12em; --label-size:11px;
  --check-radius:3px; --cell-radius:3px; --tank-radius:6px; --tank-bw:1.5px;
  --work:#2a78d6; --life:#c4471f; --warn:#a3261b; --warn-soft:#f6d9d4;
  --sheet-bg:#fbfaf6; --field-bg:#fffefa; --field-border:#c5cfdf; --toast-bg:#1c2742; --toast-ink:#fffefa;
}
html[data-theme="night"]{
  --shell:#16171a; --shell-2:#202126; --shell-3:#2a2c32; --shell-ink:#ece6da; --shell-muted:#a8a296;
  --page-img:var(--grain);
  --lcd:#1e1f23; --lcd-2:#26282d; --lcd-3:#33353b; --ink:#ece6da; --muted:#a8a296; --line:rgba(236,230,218,.12);
  --bezel:#2f3137; --card-bw:1px; --card-shadow:0 1px 0 rgba(0,0,0,.4); --card-img:var(--grain); --radius:10px;
  --amber:#e3a857; --amber-ink:#1a1408; --amber-low:transparent; --accent:#e3a857;
  --key-bg:#2a2c32; --key-ink:#ece6da; --key-border:transparent; --key-shadow:none; --key-radius:999px;
  --chip-bg:transparent; --chip-border:#3a3c43; --chip-ink:#c9c3b6; --chip-radius:999px;
  --nav-bg:rgba(22,23,26,.96); --nav-border:#2a2c32; --nav-on:#e3a857; --nav-on-bg:transparent;
  --head:"Zen Kaku Gothic New", system-ui, sans-serif; --head-size:30px; --head-weight:500; --head-case:none; --head-track:.02em;
  --pix:"DM Mono", ui-monospace, monospace; --mono:"Zen Kaku Gothic New", system-ui, sans-serif;
  --label-track:.2em; --label-size:11px;
  --check-radius:4px; --cell-radius:999px; --tank-radius:999px; --tank-bw:1.5px;
  --work:#6aa6ef; --life:#f0905c; --warn:#ff9b85; --warn-soft:#3a2420;
  --sheet-bg:#1e1f23; --field-bg:#26282d; --field-border:#3a3c43; --toast-bg:#ece6da; --toast-ink:#16171a;
}
html[data-theme="riso"]{
  --shell:#f3eee4; --shell-2:#ebe4d6; --shell-3:#e2d9c8; --shell-ink:#22307a; --shell-muted:#4b5596;
  --page-img:var(--speckle), var(--grain);
  --lcd:#fbf8f1; --lcd-2:#f1ebdf; --lcd-3:#e6dfd0; --ink:#22307a; --muted:#4b5596; --line:rgba(34,48,122,.18);
  --bezel:#22307a; --card-bw:2px; --card-shadow:4px 4px 0 #f4a6bd; --card-img:var(--grain); --radius:12px;
  --amber:#c22a5d; --amber-ink:#ffffff; --amber-low:#22307a; --accent:#22307a;
  --key-bg:#fbf8f1; --key-ink:#22307a; --key-border:#22307a; --key-shadow:2px 2px 0 #22307a; --key-radius:8px;
  --chip-bg:#fbf8f1; --chip-border:#22307a; --chip-ink:#22307a; --chip-radius:999px;
  --nav-bg:rgba(243,238,228,.96); --nav-border:#22307a; --nav-on:#c22a5d; --nav-on-bg:transparent;
  --head:"Bricolage Grotesque", system-ui, sans-serif; --head-size:34px; --head-weight:700; --head-case:none; --head-track:-.02em;
  --pix:"Space Mono", ui-monospace, monospace; --mono:"Bricolage Grotesque", system-ui, sans-serif;
  --label-track:.08em; --label-size:11px;
  --check-radius:5px; --cell-radius:4px; --tank-radius:8px; --tank-bw:2px;
  --work:#2a6fd6; --life:#c22a5d; --warn:#b3203f; --warn-soft:#f7d3dd;
  --sheet-bg:#f3eee4; --field-bg:#fbf8f1; --field-border:#22307a; --toast-bg:#22307a; --toast-ink:#fbf8f1;
}
html[data-theme="riso"] .btn.pri{box-shadow:2px 2px 0 #22307a!important}
html[data-theme="riso"] .btn:active{box-shadow:none}
html[data-theme="night"] .card .chip.on,html[data-theme="night"] .bcard .chip.on{color:var(--lcd)}
html[data-theme="night"] .day.sel{color:var(--lcd)}
html[data-theme="night"] .switch:checked::after{background:var(--lcd)}
html[data-theme="ledger"] h1{font-style:italic}
:root{
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)' opacity='.13'/></svg>");
  --speckle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .22  0 0 0 0 .12  1.6 0 0 0 -.62'/><feComponentTransfer><feFuncA type='discrete' tableValues='0 0 0 0 .45 .85 .95'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23s)'/></svg>");
  --serif:var(--head); --sans:var(--mono);
}
/* ======== base ======== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--shell-ink);font:14.5px/1.55 var(--mono);background-color:var(--shell);background-image:var(--page-img);background-attachment:fixed}
html[data-theme="handheld"] body{background-size:6px 6px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:640px;margin:0 auto;padding:18px 18px calc(100px + env(safe-area-inset-bottom))}
h1{font:var(--head-weight) var(--head-size)/1.15 var(--head);text-transform:var(--head-case);letter-spacing:var(--head-track);margin:8px 0 4px;color:var(--shell-ink)}
h2{font:500 var(--label-size)/1.2 var(--pix);text-transform:uppercase;letter-spacing:var(--label-track);margin:30px 0 12px;display:flex;align-items:center;gap:8px;color:var(--shell-ink)}
h2 .sp{flex:1}
.sub{color:var(--shell-muted);font-size:13px}
.kicker{font:500 var(--label-size)/1.3 var(--pix);text-transform:uppercase;letter-spacing:var(--label-track);color:var(--shell-muted)}
.dayline{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.dayline .ln{flex:1;height:1px;background:var(--shell-muted);opacity:.45;position:relative}
.dayline .ln i{position:absolute;left:0;top:-1px;height:3px;background:var(--shell-ink);border-radius:2px}
.dayline span{font:500 11px var(--pix);color:var(--shell-ink);letter-spacing:.04em}

/* screens / cards */
.card,.bcard,.lcd{background-color:var(--lcd);background-image:var(--card-img);color:var(--ink);border:var(--card-bw) solid var(--bezel);border-radius:var(--radius);box-shadow:var(--card-shadow)}
.card{padding:2px 0}
.bcard{padding:16px;margin-top:14px}
.card .sub,.bcard .sub,.lcd .sub{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-height:50px}
html[data-theme="handheld"] .row{border-top-style:dashed}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:12px;margin-top:1px}
.row.tap{cursor:pointer}
.grip{flex:none;align-self:stretch;display:grid;place-items:center;width:30px;margin:-12px -10px -12px -6px;color:var(--muted);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.grip svg{width:12px;height:18px;fill:currentColor;opacity:.7}
.row.col .grip{margin:0 -6px 0 -8px;align-self:center;height:34px}
[data-reorder].sorting [data-oid]{transition:transform .15s}
[data-reorder].sorting [data-oid].dragging{transition:none;position:relative;z-index:5;background:var(--lcd);box-shadow:0 6px 18px rgba(0,0,0,.18)}
body.sorting-now{-webkit-user-select:none;user-select:none}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.rowhead{display:flex;align-items:center;gap:10px}
.empty{color:var(--muted);padding:16px;font-size:13.5px}
.chk{appearance:none;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:var(--check-radius);flex:none;display:grid;place-content:center;margin:0;background:transparent;cursor:pointer}
html[data-theme="handheld"] .chk{border-width:2px}
.chk:checked{background:var(--ink)}
.chk:checked::after{content:"";width:10px;height:5px;border:2px solid var(--lcd-2);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
html[data-theme="sage"] .chk:checked::after,html[data-theme="kraft"] .chk:checked::after{border-color:var(--shell)}
.chk:disabled{cursor:default}
.done .t{color:var(--muted);text-decoration:line-through}

/* keys */
.btn{border:1.5px solid var(--key-border);background:var(--key-bg);color:var(--key-ink);border-radius:var(--key-radius);padding:8px 15px;font:500 var(--label-size) var(--pix);letter-spacing:calc(var(--label-track) * .5);text-transform:uppercase;box-shadow:var(--key-shadow);position:relative;top:0}
.btn:active{top:2px}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);box-shadow:0 3px 0 var(--amber-low)}
html:not([data-theme="handheld"]) .btn.pri{box-shadow:none}
.btn.danger{color:var(--warn)}
html[data-theme="handheld"] .btn.danger{color:#f0b49c}
.btn.sm{padding:6px 11px;font-size:10.5px}
.link{background:none;border:0;color:var(--shell-ink);font:500 var(--label-size) var(--pix);text-transform:uppercase;letter-spacing:calc(var(--label-track) * .6);padding:4px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
html[data-theme="handheld"] .link{color:var(--link,var(--amber));text-decoration:none}
.card .link,.bcard .link{color:var(--ink)}
.ghost{background:none;border:0;padding:6px;color:var(--shell-muted)}
.quick{display:flex;gap:8px;margin-top:10px}
.quick input,.search{flex:1;min-width:0;background:var(--field-bg);color:var(--ink);border:var(--card-bw) solid var(--field-border);border-radius:var(--key-radius);padding:10px 16px}
html[data-theme="handheld"] .quick input,html[data-theme="handheld"] .search{border-width:3px;border-radius:10px;box-shadow:0 0 0 2px var(--shell-3)}
.quick input::placeholder,.search::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
.search{width:100%;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{border:1px solid var(--chip-border);background:var(--chip-bg);border-radius:var(--chip-radius);padding:5px 12px;font:500 11px var(--pix);color:var(--chip-ink);letter-spacing:calc(var(--label-track) * .35)}
.chip.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.card .chip,.bcard .chip{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.card .chip.on,.bcard .chip.on{background:var(--ink);color:var(--lcd-2)}
html[data-theme="sage"] .card .chip.on,html[data-theme="sage"] .bcard .chip.on,html[data-theme="kraft"] .card .chip.on,html[data-theme="kraft"] .bcard .chip.on{color:var(--shell)}
.tag{font-size:11.5px;padding:0 7px;border-radius:999px;background:var(--lcd-3);color:var(--ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.wd{border:0;background:none;padding:6px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 11px var(--pix);color:var(--shell-muted);letter-spacing:.06em}
.wd.sel{color:var(--shell-ink);background:var(--shell-2)}
html[data-theme="handheld"] .wd.sel{background:var(--shell-3);color:var(--link,var(--amber))}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--shell-ink);position:relative;overflow:hidden;opacity:.85}
html[data-theme="handheld"] .dot{border-radius:4px;border:2px solid #4c544b}
.dot i{position:absolute;left:0;right:0;bottom:0;background:var(--shell-ink)}
html[data-theme="handheld"] .dot i{background:var(--amber)}

.ev-away .bar-l{width:6px}
.alertbar{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));max-width:616px;margin:0 auto;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--toast-bg);color:var(--toast-ink);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px}
.alertbar b{font-weight:600}
.alertbar .grow{flex:1;min-width:0}
.alertbar .btn{--key-border:var(--toast-ink);background:transparent;color:var(--toast-ink)}

.tg{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1.5;padding:0 8px;border:1.5px solid var(--cc);border-radius:999px;color:var(--ink);white-space:nowrap}
.tg::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.tgb{border:1.5px solid var(--cc)!important;display:inline-flex;align-items:center;gap:5px}
.chip.tgb::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.tgb.on{background:var(--cc)!important;color:var(--on,#fff)!important}
.chip.tgb.on::before{box-shadow:0 0 0 1.5px var(--on,#fff)}
.seg[data-seg="cat"] button.on{background:var(--cc);color:var(--on,#fff)}
.gbar{height:6px;border-radius:999px;background:var(--lcd-3);margin:7px 0 3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--cc)}
.gbar i{display:block;height:100%;background:var(--cc);border-radius:999px}
.gbar.big-bar{height:12px;margin-top:12px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.chart .mk{fill:var(--accent);stroke:var(--lcd-2);stroke-width:2;pointer-events:none}
.chart .hit:hover+.mk,.chart .hit.act+.mk{r:6}

.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.gtile{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px 10px 8px;text-align:left;min-width:0;
  background-color:var(--lcd);background-image:var(--card-img);color:var(--ink);border:var(--card-bw) solid var(--bezel);border-radius:calc(var(--radius) * .75);box-shadow:var(--card-shadow)}
.gtile .gw{font:500 13px/1.2 var(--pix);letter-spacing:calc(var(--label-track) * .3);text-transform:uppercase;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:1 0 auto}
.gtile .gbar{margin:0;height:5px}
.gtile .gp{font-size:11px;color:var(--muted)}

.kit{padding:4px 16px 6px}
.kit.off{opacity:.45}
.tk-wheel{position:relative;width:180px;height:180px;margin:10px auto 16px;border-radius:50%;cursor:crosshair;touch-action:none;
  background:radial-gradient(circle at center,#fff 0%,rgba(255,255,255,0) 70%),conic-gradient(from 90deg,hsl(0,90%,55%),hsl(60,90%,55%),hsl(120,90%,55%),hsl(180,90%,55%),hsl(240,90%,55%),hsl(300,90%,55%),hsl(360,90%,55%));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tk-thumb{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}
.tk-row{display:block;margin:12px 0}
.tk-row>span{display:flex;justify-content:space-between;font:500 10px var(--pix);letter-spacing:calc(var(--label-track) * .6);text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.tk-row>span b{font-weight:400}
.tk-slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:5px;outline:none;background:var(--lcd-3)}
.tk-slider.depth{background:linear-gradient(90deg,#111,#9aa3b2,#fff)}
.tk-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--amber);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.tk-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--amber);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.tk-sws{display:flex;flex-wrap:wrap;gap:10px}
.tk-sw{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.18);position:relative;padding:0}
.tk-sw i{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--lcd-2)}
.kicker .cat,.kicker .tg{color:inherit}

.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.macros div{display:flex;flex-direction:column;gap:2px}
.macros b{font:var(--head-weight) 20px var(--head)}
.macros span{font-size:11.5px;color:var(--muted)}
.mbar{display:flex;gap:2px;height:8px;border-radius:999px;overflow:hidden;margin-top:12px}
.mbar i{display:block;height:100%;background:var(--ink)}
.mbar i:nth-child(2){opacity:.55}
.mbar i:nth-child(3){opacity:.28}
.srcs{margin:0;padding:12px 16px 12px 32px;display:grid;gap:8px;font-size:13px;color:var(--ink)}
.srcs a{color:var(--ink)!important}

.mrow .mhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.mrow .mhead b{color:var(--ink);font-weight:600}
.mrow .gbar{margin-top:5px}

.fsout{display:grid;gap:6px;margin-top:8px;max-height:46vh;overflow:auto}
.fsr{display:flex;flex-direction:column;gap:2px;text-align:left;padding:9px 12px;border:1px solid var(--field-border);border-radius:10px;background:var(--field-bg);color:var(--ink)}
.fsr .t{font-size:14px}
.fsr .m{font-size:11.5px;color:var(--muted)}
.scanov{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center}
.scanov video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanbox{position:relative;width:72vw;max-width:340px;height:28vw;max-height:140px;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scanov [data-x]{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}
.scantip{position:absolute;top:calc(30px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-size:14px}
.warnt{color:var(--warn);font-weight:600}

.dls{display:flex;gap:3px;margin-top:6px}
.dl{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:500 9.5px var(--pix);color:var(--muted);border:1px solid var(--line)}
.dl.on{background:var(--ink);color:var(--lcd-2);border-color:var(--ink)}
</style>
</head>

  <div class="card" style="margin-top:10px"><div class="grid">${DOW.map(d => `<div class="dow">${d.slice(0,1)}</div>`).join("")}${cells}</div></div>

  <div class="card">${x.html || `<div class="empty">Nothing scheduled.</div>`}</div>`;
}

/* ---------- Body: eat, drink, sleep ---------- */
function barChart(key, days, vals, goal, max, unit, under){
  const W = 340, H = 150, L = 26, R = 6, T = 10, B = 22, ph = H - T - B, pw = W - L - R;
  const n = days.length, slot = pw / n, bw = Math.max(3, Math.min(16, slot * 0.62));
  const y = v => T + ph - (Math.min(v, max) / max) * ph;
  let g = "";
  [0, max].forEach(v => { g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`; });
  days.forEach((d, i) => {
    const cx = L + slot * i + slot / 2, v = vals[i];
    const lab = n <= 7 ? DOW[parse(d).getDay()].slice(0,1) : ((i % 5 === 0 || i === n-1) ? String(parse(d).getDate()) : "");
    if (lab) g += `<text class="axis" x="${cx}" y="${H-6}" text-anchor="middle">${lab}</text>`;
    const tip = `${fmtDay(d)}: ${v == null ? "not logged" : v + " " + unit}`;
    g += `<rect class="hit" x="${cx - slot/2}" y="${T}" width="${slot}" height="${ph}" data-tip="${esc(tip)}" data-x="${cx}" data-y="${v==null?y(0):y(v)}"/>`;
    if (v != null && v > 0){
      const top = y(v), x0 = cx - bw/2, r = Math.min(4, bw/2, (y(0)-top));
      g += `<path class="bar ${(under ? v <= goal : v >= goal) ? "" : "miss"}" d="M${x0},${y(0)} V${top+r} Q${x0},${top} ${x0+r},${top} H${x0+bw-r} Q${x0+bw},${top} ${x0+bw},${top+r} V${y(0)} Z"/>`;
    }
  });
  g += `<line class="goal" x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}"/>`;
  const rows = days.map((d, i) => `<tr><td>${esc(fmtDay(d))}</td><td>${vals[i] == null ? "—" : vals[i] + " " + unit}</td></tr>`).reverse().join("");
  return `<div class="chart" data-chart="${key}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} per day, goal ${goal}">${g}</svg></div>
    <div class="legendrow"><span><i></i>${under ? "Within target" : "Met goal"}</span><span><i class="faint"></i>${under ? "Over target" : "Below goal"}</span><span><i class="dash"></i>${under ? "Target" : "Goal"} (${goal.toLocaleString()})</span></div>
    <details class="tv"><summary>Show as table</summary><table class="tbl"><tr><th>Day</th><th>Value</th></tr>${rows}</table></details>`;
}
function statLine(vals, goal, unit, days, under){
  const got = vals.filter(v => v != null);
  if (!got.length) return `<div class="statline">Nothing logged in this range yet.</div>`;
  const avg = Math.round(got.reduce((a,b) => a+b, 0) / got.length * 10) / 10;
  const met = got.filter(v => under ? v <= goal : v >= goal).length;
  const t = today(), denom = days ? days.filter(d => d <= t).length : vals.length;
  return `<div class="statline">Average <b>${avg.toLocaleString()} ${unit}</b> · ${under ? "within target" : "goal met"} <b>${met} of ${denom}</b> days</div>`;
}
function viewTrends(){
  const t = today(), c = cfg(), u = UNITS[c.water.unit].n;

  const dayOf = d => items["day-"+d];
  const cv = days.map(d => { if (d > t) return null; const s = dayScore(d); return dayOf(d) || d === t ? (s.total ? Math.round(s.n / s.total * 100) : 0) : null; });
  const wv = days.map(d => { const x = dayOf(d); return x ? waterAmt(x, c) : null; });

  const nm = c.meals.list.length;
  const mv = days.map(d => { const x = dayOf(d); if (!x || !x.meals) return null; return c.meals.list.filter(m => x.meals[m.id]).length; });
  const maxOf = (vals, base) => Math.max(base, Math.ceil(Math.max(0, ...vals.filter(v => v != null))));

  <div class="chips" style="margin-top:12px">${[[7,"This week"],[30,"30 days"]].map(([r,l]) => `<button class="chip ${bodyRange===r?"on":""}" data-range="${r}">${l}</button>`).join("")}</div>

  ${c.sleep.on ? `<div class="bcard"><div class="lbl">Sleep · hours</div>${statLine(sv, c.sleep.goal, "h", days)}${barChart("sleep", days, sv, c.sleep.goal, maxOf(sv, 10), "h")}</div>` : ""}
  ${(() => { const fr = foodCalc(); const kv = days.map(d => { const x = dayOf(d); return x && x.eats && x.eats.length ? Math.round(sumEats(x.eats).kcal) : null; }); if (!kv.some(v => v != null)) return "";
    const tgt = fr ? fr.target : Math.max(...kv.filter(v => v != null));
    return `<div class="bcard"><div class="lbl">Calories eaten</div>${fr ? statLine(kv, tgt, "cal", days, true) : ""}${barChart("kcal", days, kv, tgt, Math.max(Math.ceil(tgt * 1.3 / 100) * 100, ...kv.filter(v => v != null)), "cal", true)}</div>`; })()}
  ${(() => { if (!repeats().length) return ""; const pv = days.map(d => { if (d > t) return null; const pl = plannedFor(d); if (!pl.length) return null; return Math.round(pl.filter(r => eatenRepeat(d, r.id)).length / pl.length * 100); });
    return `<div class="bcard"><div class="lbl">Planned food eaten · %</div>${statLine(pv, 100, "%", days)}${barChart("plan", days, pv, 100, 100, "%")}</div>`; })()}`;
}
function wireCharts(){
  document.querySelectorAll("[data-chart]").forEach(ch => {
    let tip = null, act = null;
    const show = r => { if (act) act.classList.remove("act"); act = r; r.classList.add("act");
      const svg = ch.querySelector("svg"), sc = svg.getBoundingClientRect().width / 340;
      if (!tip){ tip = document.createElement("div"); tip.className = "tip"; ch.appendChild(tip); }
      tip.textContent = r.dataset.tip; tip.style.left = (Number(r.dataset.x) * sc) + "px"; tip.style.top = (Number(r.dataset.y) * sc) + "px"; };
    ch.querySelectorAll(".hit").forEach(r => { r.addEventListener("pointerenter", () => show(r)); r.addEventListener("click", () => show(r)); });
    ch.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && tip){ tip.remove(); tip = null; if (act) act.classList.remove("act"); } });
  });
}

/* ---------- Goals ---------- */
const GTYPES = {value: "Reach a number", sum: "Add up to a total", milestones: "Milestones", reel: "Reel project"};
const clamp01 = v => Math.max(0, Math.min(1, v));
function fmtV(v, unit){ if (v == null || isNaN(v)) return "—"; const n = Math.round(v * 100) / 100; if (unit === "$") return (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString(undefined, {maximumFractionDigits: 2}); return `${n.toLocaleString(undefined, {maximumFractionDigits: 2})}${unit ? " " + unit : ""}`; }
const sortedLog = g => (g.log || []).slice().sort((a, b) => a.d.localeCompare(b.d) || (a.at || 0) - (b.at || 0));
function goalCur(g){ const L = sortedLog(g); if (g.type === "value") return L.length ? L[L.length-1].v : g.start; if (g.type === "sum") return L.reduce((a, x) => a + x.v, 0); return null; }
function goalProg(g){
  if (g.type === "value"){ const span = g.target - g.start; return span ? clamp01((goalCur(g) - g.start) / span) : 1; }
  if (g.type === "sum") return g.target > 0 ? clamp01(goalCur(g) / g.target) : 0;
  if (g.type === "milestones"){ const st = g.steps || []; return st.length ? st.filter(x => x.done).length / st.length : 0; }
  if (g.type === "reel") return reelStats().filled / 108;
  return 0;
}
function goalLine(g){
  if (g.type === "value"){ const cur = goalCur(g), left = Math.abs(g.target - cur), dir = g.target < g.start ? "to lose" : "to go"; return goalProg(g) >= 1 ? `Reached ${fmtV(g.target, g.unit)} 🎉` : `${fmtV(cur, g.unit)} now · ${fmtV(left, g.unit)} ${dir}`; }
  if (g.type === "sum") return `${fmtV(goalCur(g), g.unit)} of ${fmtV(g.target, g.unit)}`;
  if (g.type === "milestones"){ const st = g.steps || []; return `${st.filter(x => x.done).length} of ${st.length} steps`; }
  if (g.type === "reel"){ const r = reelStats(); return `${r.filled} of 108 beats written${r.title && r.title !== "Untitled story" ? " · " + r.title : ""}`; }
  return "";
}
function dueLine(g){
  if (!g.due) return "";
  const days = dIdx(g.due) - dIdx(today());
  let s = days > 1 ? `${days} days left` : days === 1 ? "Due tomorrow" : days === 0 ? "Due today" : `${-days} days past target`;
  if ((g.type === "value" || g.type === "sum") && days > 0 && goalProg(g) < 1){
    const remain = g.type === "sum" ? g.target - goalCur(g) : Math.abs(g.target - goalCur(g)), weeks = days / 7;
    const per = remain / Math.max(weeks, 1/7);
    s += ` · about ${fmtV(g.unit === "$" ? Math.ceil(per) : Math.round(per * 10) / 10, g.unit)} a week`;
  }
  return s;
}
const shortName = g => (g.title || "").trim() || "Goal";
const activeGoals = () => all("goal").filter(g => !g.archived).sort(byOrder((a, b) => (a.created || 0) - (b.created || 0)));
function goalBar(g){ return `<div class="gbar" style="--cc:${catColor(g)}"><i style="width:${Math.round(goalProg(g) * 100)}%"></i></div>`; }
function goalAction(g){
  if (g.type === "value" || g.type === "sum") return `<button class="btn sm" data-goal-quick="${g.id}">${g.type === "sum" ? "Add" : "Log"}</button>`;

}
function goalRow(g, dr){

}
function lineChart(key, pts, target, unit){
  const W = 340, H = 160, L = 44, R = 8, T = 12, B = 22, ph = H - T - B, pw = W - L - R;
  if (!pts.length) return `<div class="empty" style="padding:12px 0">No entries yet. Your chart starts with the first one.</div>`;
  const vals = pts.map(p => p.v).concat(target != null ? [target] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (lo === hi){ lo -= 1; hi += 1; } const pad0 = (hi - lo) * 0.08; lo -= pad0; hi += pad0;
  const x0 = dIdx(pts[0].d), x1 = dIdx(pts[pts.length-1].d);
  const X = d => pts.length === 1 || x1 === x0 ? L + pw / 2 : L + (dIdx(d) - x0) / (x1 - x0) * pw;
  const Y = v => T + ph - (v - lo) / (hi - lo) * ph;
  let g = "";
  [lo + pad0, hi - pad0].forEach(v => { g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">${esc(fmtV(v, unit === "$" ? "$" : ""))}</text>`; });
  if (target != null) g += `<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(target)}" y2="${Y(target)}"/>`;
  g += `<polyline class="ln" points="${pts.map(p => `${X(p.d)},${Y(p.v)}`).join(" ")}"/>`;
  const first = parse(pts[0].d), last = parse(pts[pts.length-1].d);
  g += `<text class="axis" x="${L}" y="${H-6}">${MON[first.getMonth()].slice(0,3)} ${first.getDate()}</text>`;
  if (pts.length > 1) g += `<text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${MON[last.getMonth()].slice(0,3)} ${last.getDate()}</text>`;
  pts.forEach((p, i) => {
    const cx = X(p.d), w = pts.length > 1 ? Math.max(12, pw / pts.length) : 40;
    g += `<rect class="hit" x="${cx - w/2}" y="${T}" width="${w}" height="${ph}" data-tip="${esc(fmtDay(p.d) + ": " + fmtV(p.v, unit))}" data-x="${cx}" data-y="${Y(p.v)}"/><circle class="mk" cx="${cx}" cy="${Y(p.v)}" r="4"/>`;
  });
  return `<div class="chart" data-chart="${key}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress over time">${g}</svg></div>
    <div class="legendrow"><span><i style="height:2px;width:14px;vertical-align:3px"></i>${unit === "$" ? "Saved so far" : "Your entries"}</span>${target != null ? `<span><i class="dash"></i>Target (${esc(fmtV(target, unit))})</span>` : ""}</div>`;
}

}

  ["1.2", "Sedentary", "Desk job, little or no exercise"],
  ["1.375", "Lightly active", "Light exercise 1–3 days a week"],
  ["1.55", "Moderately active", "Moderate exercise 3–5 days a week"],
  ["1.725", "Very active", "Hard exercise 6–7 days a week"],
  ["1.9", "Extremely active", "Physical job plus hard training"],
];
const GOALS = [["lose1", "Lose 1 lb/week", -500], ["lose05", "Lose ½ lb/week", -250], ["keep", "Maintain", 0], ["gain05", "Gain ½ lb/week", 250]];
function foodCfg(){ const f = (items.settings || {}).food || {}; return {sex: f.sex || "", age: f.age || "", ft: f.ft ?? "", inch: f.inch ?? "", act: f.act || "1.375", goal: f.goal || "keep", bf: f.bf || "", proL: f.proL || 1.9}; }
function saveFood(p){ saveCfg({food: {...foodCfg(), ...p}}); }
function foodCalc(){
  const f = foodCfg(), lb = cfg().water.weight, age = +f.age, inches = (+f.ft || 0) * 12 + (+f.inch || 0);
  if (!lb || !age || !inches || !f.sex) return null;
  const kg = lb * 0.45359237, cm = inches * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * age + (f.sex === "m" ? 5 : -161);
  const tdee = bmr * +f.act;
  const g = GOALS.find(x => x[0] === f.goal) || GOALS[2];
  let target = tdee + g[2], floored = false;
  const floor = f.sex === "m" ? 1500 : 1200;
  if (g[2] < 0 && target < floor){ target = floor; floored = true; }
  target = Math.round(target / 10) * 10;
  const lbmKg = +f.bf > 0 ? kg * (1 - f.bf / 100) : (f.sex === "m" ? 0.407 * kg + 0.267 * cm - 19.2 : 0.252 * kg + 0.473 * cm - 48.3);
  const proG = Math.round(lbmKg * f.proL), fatKcal = target * 0.30, fatG = Math.round(fatKcal / 9);
  const carbG = Math.max(0, Math.round((target - proG * 4 - fatG * 9) / 4));
  const pct = k => Math.round(k / target * 100);
  return {lbmLb: Math.round(lbmKg / 0.45359237), lbmEst: !(+f.bf > 0), lb, kg, age, inches, bmr: Math.round(bmr), tdee: Math.round(tdee), target, floored, floor, g, proG, fatG, carbG,
    proPct: pct(proG * 4), fatPct: pct(fatG * 9), carbPct: pct(carbG * 4)};
}

    <p><b>Maintenance</b> multiplies that by a standard activity factor, from 1.2 for sedentary to 1.9 for extremely active.</p>
    <p><b>Your goal</b> takes off 500 calories a day to lose about 1 lb a week, as the NIH suggests, or 250 for about ½ lb. Gaining adds 250. For weight loss, the 2013 AHA/ACC/TOS obesity guideline uses 1,200–1,500 calories for women and 1,500–1,800 for men, so the target never goes below the bottom of those ranges.</p>

    <p style="margin-bottom:0">All of this is an estimate, usually within about 10%. Weigh in weekly. If your weight isn't moving the way the goal says after 2–3 weeks, adjust by 100–200 calories. These formulas aren't meant for pregnancy, under-18s or medical conditions; check with a doctor or dietitian in those cases.</p>

/* ---------- food database search (Open Food Facts + USDA FoodData Central) ---------- */
const FDC_NUT = {kcal: ["208", "958", "957"], p: ["203"], c: ["205"], f: ["204"]};
const rnd1 = v => v == null || isNaN(v) ? "" : Math.round(v * 10) / 10;
async function searchOFF(q){
  const base = "https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&json=1&page_size=15&fields=code,product_name,brands,serving_size,serving_quantity,nutriments&search_terms=" + encodeURIComponent(q);
  const us = await searchOFFUrl(base + "&tagtype_0=countries&tag_contains_0=contains&tag_0=united-states").catch(() => []);
  if (us.length >= 3) return us;
  const world = await searchOFFUrl(base).catch(() => []);
  if (!us.length && !world.length) throw new Error("off unreachable");
  return us.concat(world.filter(x => !us.some(y => y.name === x.name))).slice(0, 15);
}
async function searchOFFUrl(u){
  let r, last;
  for (let i = 0; i < 3 && !r; i++){ try { r = await fetch(u); } catch (e) { last = e; await new Promise(z => setTimeout(z, 800 * (i + 1))); } }
  if (!r) throw last || new Error("off unreachable");
  if (!r.ok) throw new Error("off " + r.status);
  const j = await r.json();
  return (j.products || []).map(offToFood).filter(Boolean);
}
function offToFood(p){
  const n = p.nutriments || {}, name = (p.product_name || "").trim(); if (!name) return null;
  const sq = +p.serving_quantity, hasServ = n["energy-kcal_serving"] != null || (sq > 0 && n["energy-kcal_100g"] != null);
  const per = k => hasServ ? (n[k + "_serving"] != null ? +n[k + "_serving"] : (n[k + "_100g"] != null ? +n[k + "_100g"] * sq / 100 : null)) : (n[k + "_100g"] != null ? +n[k + "_100g"] : null);
  const kcal = per("energy-kcal"); if (kcal == null) return null;
  return {src: "Open Food Facts", srcNote: "user-added, check the label", name: name + (p.brands ? " · " + p.brands.split(",")[0].trim() : ""), serving: hasServ ? (p.serving_size || sq + " g") : "100 g",
    kcal: rnd1(kcal), p: rnd1(per("proteins")), c: rnd1(per("carbohydrates")), f: rnd1(per("fat"))};
}
async function searchFDC(q){
  const key = (items.settings || {}).fdcKey || "DEMO_KEY";
  const u = "https://api.nal.usda.gov/fdc/v1/foods/search?pageSize=15&dataType=Foundation,SR%20Legacy&api_key=" + encodeURIComponent(key) + "&query=" + encodeURIComponent(q);
  const r = await fetch(u); if (r.status === 429) throw new Error("fdc-limit"); if (!r.ok) throw new Error("fdc " + r.status);
  const j = await r.json();
  return (j.foods || []).map(f => {
    // priority order: plain Energy (208), then Atwater specific (958), then Atwater general (957)
    const get = ids => { for (const id of ids){ const x = (f.foodNutrients || []).find(n => String(n.nutrientNumber) === id && /kcal|g/i.test(n.unitName || "")); if (x) return Math.max(0, +x.value); } return null; };
    let kcal = get(FDC_NUT.kcal); if (kcal == null) return null;
    let p = get(FDC_NUT.p), c = get(FDC_NUT.c), ft = get(FDC_NUT.f), serving = "100 g";
    if (f.dataType === "Branded" && f.servingSize && /^g|ml$/i.test(f.servingSizeUnit || "")){ const k = f.servingSize / 100; kcal *= k; p = p == null ? null : p * k; c = c == null ? null : c * k; ft = ft == null ? null : ft * k; serving = Math.round(f.servingSize) + " " + (f.servingSizeUnit || "g").toLowerCase(); }
    const title = (f.description || "").toLowerCase().replace(/(^|[\s,(])\S/g, s => s.toUpperCase());
    return {src: "USDA", srcNote: "lab-measured", name: title + (f.brandName || f.brandOwner ? " · " + (f.brandName || f.brandOwner) : ""), serving, kcal: rnd1(kcal), p: rnd1(p), c: rnd1(c), f: rnd1(ft)};
  }).filter(Boolean);
}
async function lookupBarcode(code){
  const r = await fetch("https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(code) + ".json?fields=code,product_name,brands,serving_size,serving_quantity,nutriments");
  if (!r.ok) return null; const j = await r.json(); return j.status === 1 ? offToFood(j.product) : null;

async function foodSearch(q){
  const res = await Promise.allSettled([searchFDC(q), searchOFF(q)]);
  const out = [], errs = [];
  res.forEach(x => x.status === "fulfilled" ? out.push(...x.value) : errs.push(String(x.reason && x.reason.message || x.reason)));

  return {list: out.slice(0, 30), errs};
}
function addsUp(x){ const k = +x.kcal, m = 4 * (+x.p || 0) + 4 * (+x.c || 0) + 9 * (+x.f || 0); if (!k || !m) return true; return Math.abs(m - k) <= Math.max(25, k * 0.25); }
function wireFoodSearch(S){

async function scanBarcode(onCode){
  if (!("BarcodeDetector" in window) || !navigator.mediaDevices){ toast("Barcode scanning isn't supported here."); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}}); }
  catch { toast("Camera access was blocked."); return; }
  const ov = document.createElement("div"); ov.className = "scanov";
  ov.innerHTML = `<video playsinline muted></video><div class="scanbox"></div><button class="btn" data-x>Cancel</button><div class="scantip">Point at the barcode</div>`;
  document.body.appendChild(ov);
  const v = ov.querySelector("video"); v.srcObject = stream; await v.play().catch(() => {});
  const det = new BarcodeDetector({formats: ["ean_13", "ean_8", "upc_a", "upc_e"]});

}

/* ---------- servings scaler: fields show totals; changing any number scales the rest ---------- */
const NUTS = [["kcal","Calories",0],["p","Protein (g)",1],["c","Carbs (g)",1],["f","Fat (g)",1]];

  const L = $("#layer");
  L.innerHTML = `<div class="ov"><div class="ovbar"><button class="btn sm" data-close>‹ Notes</button><span class="ttl"></span>

/* ---------- Vault ---------- */
const MAXHTML = 240000;
const BUILTIN = [
  {id:"bi-reel", title:"Reel", desc:"Storyboard"},
  {id:"bi-circulate", title:"Circulate", desc:"Beat maker"},
];
const biCache = {};
function builtinHtml(id){ if (biCache[id]) return biCache[id]; const el = document.getElementById(id); if (!el) return ""; const bin = atob(el.textContent.trim()); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return (biCache[id] = new TextDecoder().decode(bytes)); }
function viewVault(){
  const vs = all("html").sort((a,b) => (b.updated||0)-(a.updated||0));
  return `<div class="hdr"><div class="grow"><h1>Vault</h1><div class="sub">Your saved HTML pages: tools, guides, anything. Open them right here.</div></div></div>
  <div class="chips" style="margin-top:12px"><label class="btn pri" style="display:inline-block">Upload .html<input type="file" accept=".html,.htm,text/html" id="vault-file" hidden></label><button class="btn" data-act="paste-html">Paste HTML</button></div>
  <h2>Built in</h2>
  <div class="card">${BUILTIN.map(b => `<div class="row tap" data-open-html="${b.id}"><div class="grow"><div class="t">${esc(b.title)}</div><div class="m">${esc(b.desc)}</div></div><span class="sub">Open ›</span></div>`).join("")}</div>
  <h2>Your pages</h2>
  <div class="card">${vs.length ? vs.map(v => `<div class="row tap" data-open-html="${v.id}"><div class="grow"><div class="t">${esc(v.title || "Untitled page")}</div><div class="m">${Math.max(1,Math.round((v.html||"").length/1024))} KB · updated ${esc(relDay(ymd(new Date(v.updated||Date.now()))))}</div></div><span class="sub">Open ›</span></div>`).join("") : `<div class="empty">Nothing here yet. Upload an HTML file or paste its code.</div>`}</div>
  <div class="banner">Want one of these built into the app itself? Send it to Claude and ask for it to become its own tab.</div>`;
}
function titleFromHtml(h, fallback){ const m = /<title[^>]*>([^<]*)<\/title>/i.exec(h); return (m && m[1].trim()) || fallback || "Untitled page"; }
function saveHtml(id, title, html){
  if (new Blob([html]).size > MAXHTML){ toast("That page is over 240 KB, too big to store. Ask Claude to slim it down."); return false; }
  const cur = items[id] || {kind:"html", created: Date.now()};
  put(id, {...cur, title, html, updated: Date.now()});
  return true;
}
let frameWin = null, frameApp = null, flushWait = null;
function openHtml(id){
  const bi = BUILTIN.find(b => b.id === id);
  const v = bi ? {title: bi.title, html: builtinHtml(id)} : items[id]; if (!v) return;
  const L = $("#layer");
  L.innerHTML = `<div class="ov"><div class="ovbar"><button class="btn sm" data-close>‹ Apps</button><span class="ttl">${esc(v.title)}</span><span class="sub" id="fsave">${bi ? "Saves automatically" : ""}</span></div>
    <iframe class="frame" sandbox="allow-scripts allow-forms allow-modals" title="${esc(v.title)}"></iframe></div>`;
  const fr = L.querySelector("iframe");
  frameApp = bi ? id.replace("bi-", "") : null;
  fr.srcdoc = v.html; frameWin = fr.contentWindow;
  L.querySelector("[data-close]").onclick = () => {
    const done = () => { flushWait = null; const k = "app-" + frameApp; if (frameApp && items[k]){ clearTimeout(debT[k]); write(k); } frameWin = null; frameApp = null; L.innerHTML = ""; render(); };
    if (!frameApp || !frameWin){ done(); return; }
    const to = setTimeout(done, 900); flushWait = () => { clearTimeout(to); setTimeout(done, 50); };
    try { frameWin.postMessage({base: 1, type: "flush"}, "*"); } catch { done(); }
  };
}
window.addEventListener("message", ev => {
  if (!frameWin || ev.source !== frameWin || !frameApp) return;
  const m = ev.data || {}; if (m.base !== 1) return;
  const k = "app-" + frameApp, cur = items[k] || {kind: "appdata", app: frameApp};
  if (m.type === "load"){ frameWin.postMessage({base: 1, type: "state", data: cur.data || null, style: frameStyle()}, "*"); return; }
  if (m.type === "theme"){ putDebounced(k, {...cur, theme: m.data}); return; }
  if (m.type === "save" && m.data == null){ if (flushWait) flushWait(); return; }
  if (m.type === "save"){
    const size = typeof m.data === "string" ? m.data.length : JSON.stringify(m.data).length;
    if (size > 3500000) toast("Too big to keep on this phone. Try fewer or shorter sounds.");
    else { putDebounced(k, {...cur, data: m.data, updated: Date.now()}); const fs = $("#fsave"); if (fs) fs.textContent = "Saved " + clock(Date.now()); }
    if (flushWait) flushWait();
  }
});
function toRGB(c){ const d = document.createElement("span"); d.style.color = c; document.body.appendChild(d); const v = getComputedStyle(d).color; d.remove(); const m = v.match(/[\d.]+/g) || [0,0,0]; return [+m[0], +m[1], +m[2]]; }
function frameStyle(){
  const root = document.documentElement, cs = getComputedStyle(root), g = n => cs.getPropertyValue(n).trim();
  const same = g("--shell-ink") === g("--ink");
  const solid = v => !v || v === "transparent" || /rgba\([^)]*,\s*0\)$/.test(v) ? null : v;
  const page = same ? g("--shell") : g("--lcd-3");
  const card = solid(g("--lcd")) || page;
  const lk = document.querySelector('link[href*="fonts.googleapis"]');
  return {page, img: same ? getComputedStyle(document.body).backgroundImage : "none", card, cardSolid: (g("--lcd") && !/rgba|transparent/.test(g("--lcd"))) ? g("--lcd") : g("--lcd-2"),
    card2: g("--lcd-2"), card3: g("--lcd-3"), field: g("--field-bg"), line: g("--chip-border") || g("--line"), edge: g("--bezel"),
    ink: g("--ink"), muted: g("--muted"), ...(() => {
      // the accent doubles as text in the mini apps, so it has to read on their cards
      const bgs = [toRGB(page), toRGB(solid(g("--lcd")) || g("--lcd-2")), toRGB(g("--lcd-2"))];
      const ok = c => bgs.every(b => crat(toRGB(c), b) >= 4.5);
      const acc = ok(g("--amber")) ? g("--amber") : ok(g("--accent")) ? g("--accent") : g("--ink");
      const a = toRGB(acc), on = crat(a, [255,255,255]) >= crat(a, [16,22,31]) ? "#ffffff" : "#10161f";
      return {accent: acc, onAccent: acc === g("--amber") ? g("--amber-ink") : on};
    })(), body: g("--mono"), head: g("--head"), fonts: lk ? lk.href : ""};
}
function reelStats(){
  const d = (items["app-reel"] || {}).data; if (!d || !d.pages) return {filled: 0, title: ""};
  let n = 0; for (const k in d.pages){ const pg = d.pages[k] || {}; if ((pg.t && pg.t.trim()) || (Array.isArray(pg.s) && pg.s.some(st => !st.e))) n++; }
  return {filled: n, title: d.title || ""};
}
function htmlSheet(id){
  const v = id ? items[id] : null;
  sheet(v ? "Edit page" : "Paste HTML", `
    <label class="fld"><span>Title</span><input name="title" value="${esc(v?.title||"")}" placeholder="Taken from the page if blank"></label>
    <label class="fld"><span>HTML code</span><textarea name="html" style="min-height:220px;font:12.5px/1.4 ui-monospace,monospace" placeholder="<!DOCTYPE html>…">${esc(v?.html||"")}</textarea></label>`,
    f => { const html = f.html.value; if (!html.trim()) return "Paste some HTML first."; const nid = id || uid(); if (!saveHtml(nid, f.title.value.trim() || titleFromHtml(html), html)) return "Too large to store."; if (id) openHtml(id); },
    id ? () => confirmSheet("Delete this page?", "It will be removed from your vault.", () => { del(id); $("#layer").innerHTML = ""; }) : null);
}

/* ---------- monthly backup ---------- */
const BK = "base-backup-v1";
function bkState(){ try { return JSON.parse(localStorage.getItem(BK) || "{}"); } catch { return {}; } }
function bkSet(o){ try { localStorage.setItem(BK, JSON.stringify({...bkState(), ...o})); } catch {} }
function lastBackup(){ return bkState().last || null; }
function backupJson(){ return JSON.stringify({app:"base", v:1, at:new Date().toISOString(), items}); }
function markBackedUp(){ bkSet({last: today(), snooze: null}); render(); }
function backupDue(){
  if (!Object.values(items).some(v => v)) return false;          // nothing to back up yet
  const st = bkState(), t = today();
  if (st.snooze && st.snooze > t) return false;                    // "remind me tomorrow"
  return !st.last || st.last.slice(0,7) < t.slice(0,7);            // not yet backed up this month
}
async function doBackup(){
  const data = backupJson();
  try { await navigator.clipboard.writeText(data); markBackedUp(); backupSaved(); }
  catch { backupText(data); }
}
function backupSaved(){
  sheet("Backup copied ✓", `<div class="sub" style="line-height:1.6">Now paste it somewhere safe, off this phone:<br>
    • an email to yourself (subject: <b>Base backup ${esc(today().slice(0,7))}</b>), or<br>
    • a note in Google Keep or Google Drive.<br><br>
    To restore later: gear icon → <b>Restore from backup</b> → paste.</div>`, () => {}, null, "Got it");
}
function backupPrompt(){
  const last = lastBackup();
  sheet("Monthly backup", `<div class="sub" style="line-height:1.6">${last ? "It's a new month. " : ""}Everything in Base lives only on this phone, so take 20 seconds to save a copy.<br><br>
    ${last ? `Last backup: <b>${esc(fmtDay(last))}</b>` : "You haven't made a backup yet."}</div>
    <div class="chips" style="margin-top:14px"><button type="button" class="btn sm" data-snooze>Remind me tomorrow</button></div>`,
    () => doBackup(), null, "Copy backup");
  const sn = $(".sheet [data-snooze]");
  if (sn) sn.onclick = () => { bkSet({snooze: addDays(today(), 1)}); $(".scrim")?.remove(); };
}

function restoreSheet(){

    async f => { let o; try { o = JSON.parse(f.b.value); } catch { return "That doesn't look like a backup."; } if (!o || !o.items) return "That doesn't look like a backup."; for (const [id, v] of Object.entries(o.items)) if (v && v.kind){ items[id] = v; dirty.add(id); await write(id); } render(); toast("Restored."); }, null, "Restore");
}
function moveUp(list, id, save){ const i = list.findIndex(x => x.id === id); if (i < 1) return; list.splice(i-1, 0, list.splice(i,1)[0]); save(list); }
document.addEventListener("change", e => {
  const el = e.target, c = cfg();
  if (el.dataset.habTitle){ const id = el.dataset.habTitle, v = el.value.trim(); if (v && items[id]) put(id, {...items[id], title: v}); return; }
  if (el.dataset.tagName){ const v = el.value.trim(); if (!v) return render(); saveCfg({tags: tags().map(t => t.id === el.dataset.tagName ? {...t, name: v} : t)}); return; }
  if (el.dataset.catColor){ saveCfg({catColors: {...((items.settings||{}).catColors || {}), [el.dataset.catColor]: Number(el.value)}}); return; }
  if (el.dataset.tagCat){ saveCfg({tags: tags().map(t => t.id === el.dataset.tagCat ? {...t, cat: el.value} : t)}); return; }
  if (el.dataset.tagColor){ saveCfg({tags: tags().map(t => t.id === el.dataset.tagColor ? {...t, c: Number(el.value)} : t)}); return; }
  if (el.dataset.mealName){ const v = el.value.trim(); if (!v) return render(); saveCfg({mealsCfg: {...c.meals, list: c.meals.list.map(m => m.id === el.dataset.mealName ? {...m, name: v} : m)}}); return; }
  const num = () => Number(el.value);
  if (el.id === "set-water-unit"){ const goalMl = c.water.goal * UNITS[c.water.unit].ml, nu = el.value, U = UNITS[nu]; saveCfg({water: {...rawWater(), unit: nu, step: U.step, goal: nu === "ml" ? Math.round(goalMl / 50) * 50 : nu === "oz" ? Math.max(8, Math.round(goalMl / U.ml / 8) * 8) : Math.max(1, Math.round(goalMl / U.ml))}}); return; }
  if (el.id === "set-water-step"){ if (num() > 0) saveCfg({water: {...rawWater(), step: num()}}); else render(); return; }
  if (el.id === "food-age"){ const v = Math.round(num()); if (v >= 18 && v <= 100) saveFood({age: v}); else { toast("Age 18–100."); render(); } return; }
  if (el.id === "food-ft"){ const v = Math.round(num()); if (v >= 3 && v <= 8) saveFood({ft: v}); else render(); return; }
  if (el.id === "food-in"){ const v = Math.round(num() * 10) / 10; if (v >= 0 && v < 12) saveFood({inch: v}); else render(); return; }
  if (el.id === "food-pro"){ saveFood({proL: Math.round(num() * 10) / 10}); return; }
  if (el.id === "food-bf"){ const v = num(); if (el.value === "" ) saveFood({bf: ""}); else if (v >= 3 && v <= 70) saveFood({bf: Math.round(v * 10) / 10}); else { toast("Body fat 3–70%."); render(); } return; }
  if (el.id === "set-fdc"){ saveCfg({fdcKey: el.value.trim()}); return; }
  if (el.id === "set-weight"){ const w = num(); if (!(w >= 50 && w <= 700)){ toast("Enter your weight in pounds."); render(); return; }
    const first = !c.water.weight; saveCfg({water: {...rawWater(), weight: r1(w), ...(first ? {auto: true, unit: "oz", step: 8} : {})}}); if (first) toast("Water goal set to " + Math.round(w/2) + " oz a day."); return; }
  if (el.id === "set-water-goal"){ if (num() > 0) saveCfg({water: {...rawWater(), goal: num()}}); else render(); return; }
  if (el.id === "set-sleep-goal"){ if (num() >= 3 && num() <= 14) saveCfg({sleepCfg: {...c.sleep, goal: num()}}); else render(); return; }
});
function backupText(data){ sheet("Your backup", `<div class="sub" style="margin-bottom:8px">Your phone blocked automatic copying. Long-press the box → Select all → Copy, then paste it into an email to yourself or a note.</div><textarea readonly style="width:100%;min-height:200px;font:12px ui-monospace,monospace">${esc(data)}</textarea>`, () => { markBackedUp(); }, null, "I've saved it"); }

/* ---------- task & event sheets ---------- */
function taskSheet(id, preset = {}){
  const t = id ? items[id] : {title:"", due: preset.date || today(), time:"", notes:"", cat: defCat(), tags: []};
  sheet(id ? "Task" : "New task", `
    <label class="fld"><span>What</span><input name="title" value="${esc(t.title)}" required></label>
    <div class="fld"><span>Category & tags</span>${catPicker(catOf(t), extraIds(t))}</div>
    <div class="two"><label class="fld"><span>Date (blank = someday)</span><input type="date" name="due" value="${esc(t.due||"")}"></label>
    <label class="fld"><span>Time (makes it a reminder)</span><input type="time" name="time" value="${esc(t.time||"")}"></label></div>
    ${recurFields(t.repeat, t.due || today())}
    <label class="fld rp-regen" style="display:flex;align-items:center;gap:12px;margin-top:-4px"><span style="margin:0;flex:1">Count from when I finish<span class="sub" style="display:block;text-transform:none;letter-spacing:0;font-family:var(--sans)">The next one is due that long after you check this off, not on a fixed schedule.</span></span><input type="checkbox" class="switch" name="regen" ${t.repeat && t.repeat.regen ? "checked" : ""}></label>
    <label class="fld"><span>Notes</span><textarea name="notes">${esc(t.notes||"")}</textarea></label>
    ${id && t.due && t.time ? `<div style="margin:-2px 0 12px"><a class="link" target="_blank" rel="noopener" href="${gcalLink(t.title, t.due, t.time, 15, t.notes)}">Get a phone alert via Google Calendar ↗</a></div>` : ""}`,
    f => { const title = f.title.value.trim(); if (!title) return "Give it a name.";
      const rep = readRecur(f, f.due.value || today()); if (typeof rep === "string") return rep;
      if (rep && !f.due.value) return "Pick a date for a repeating task.";
      if (rep && f.regen.checked && rep.freq !== "weekdays"){ rep.regen = true; delete rep.mode; delete rep.days; }
      const nid = id || uid(), old = items[nid] || {kind:"task", done:false, created:Date.now()};
      const same = old.repeat && rep && JSON.stringify({...old.repeat}) === JSON.stringify(rep);
      put(nid, {...old, title, cat: f.cat.value, tags: f.tags.value.split(",").filter(Boolean), due: f.due.value || null, time: f.due.value ? (f.time.value || null) : null, notes: f.notes.value,
        repeat: rep, rstart: rep ? (same && old.rstart ? old.rstart : f.due.value) : null, rn: rep ? (same && old.rn ? old.rn : 1) : null}); },
    id ? () => { del(id); } : null);
  const S = $(".sheet"); wireRecur(S, "due");
  const rg = () => { const fq = S.querySelector("[name=freq]").value; S.querySelector(".rp-regen").style.display = fq === "none" || fq === "weekdays" ? "none" : ""; };
  S.addEventListener("click", () => setTimeout(rg, 10)); S.addEventListener("change", () => setTimeout(rg, 10)); rg();
}
function addUnits(d, freq, n){ const a = parse(d);
  if (freq === "daily") return addDays(d, n); if (freq === "weekly") return addDays(d, 7 * n);
  const m = freq === "monthly" ? n : 12 * n, t = new Date(a.getFullYear(), a.getMonth() + m, 1); t.setDate(Math.min(a.getDate(), dim(t))); return ymd(t); }
function nextTaskDue(t){
  const r = t.repeat; if (!r || !r.freq || !t.due) return null;
  if (r.count && (t.rn || 1) >= r.count) return null;
  let nx;
  if (r.regen) nx = addUnits(today() > t.due ? today() : t.due, r.freq, Math.max(1, r.interval || 1));
  else nx = nextOcc({date: t.rstart || t.due, repeat: {...r, count: 0}, ex: []}, addDays(t.due, 1));
  if (!nx || (r.until && nx > r.until)) return null;
  return nx;
}
function toggleTask(id){
  const t = items[id]; if (!t) return;
  if (!t.done){
    const nx = nextTaskDue(t); let spawned = null;
    if (nx){ spawned = uid(); const {order, ...rest} = t; put(spawned, {...rest, done: false, doneAt: null, created: Date.now(), due: nx, rn: (t.rn || 1) + 1, spawned: null}, {silent: true}); }
    put(id, {...t, done: true, doneAt: Date.now(), spawned});
    if (nx) toast(`Next one: ${relDay(nx)}`);
  } else {
    const sp = t.spawned && items[t.spawned]; if (sp && !sp.done) del(t.spawned);
    put(id, {...t, done: false, doneAt: null, spawned: null});
  }
}
function eventSheet(id, preset = {}){
  const src = id ? items[id] : null;
  const occ = preset.occ || (src ? src.date : null);
  const isSeries = !!(src && src.repeat && src.repeat.freq);
  const e = src ? {...src} : {title:"", date: preset.date || today(), start:"", end:"", note:"", cat: catFilter === "work" ? "work" : catFilter === "life" ? "life" : (tagById(catFilter) && tagById(catFilter).cat !== "both" ? tagById(catFilter).cat : defCat()), tags: tagById(catFilter) ? [catFilter] : [], show:"busy"};
  // when editing one occurrence, show that occurrence's dates
  let date = e.date, endDate = e.endDate || "";
  if (isSeries && occ && occ !== e.date){ const sp = spanOf(e); date = occ; endDate = sp ? addDays(occ, sp) : ""; }
  const allDay = !!e.allDay || (src && !e.start);
  sheet(id ? "Event" : "New event", `
    ${isSeries ? `<div class="fld"><span>Apply changes to</span><div class="seg" data-seg="scope"><button type="button" data-val="one" class="on">This event</button><button type="button" data-val="all">All in series</button></div><input type="hidden" name="scope" value="one"></div>` : ""}
    <label class="fld"><span>Title</span><input name="title" value="${esc(e.title)}" required></label>
    <div class="fld"><span>Category & tags</span>${catPicker(catOf(e), extraIds(e))}</div>
    <label class="fld" style="display:flex;align-items:center;gap:12px"><span style="margin:0;flex:1">All day</span><input type="checkbox" class="switch" name="allday" ${allDay?"checked":""}></label>
    <div class="two"><label class="fld"><span>Starts</span><input type="date" name="date" value="${esc(date)}" required></label>
      <label class="fld tm"><span>Start time</span><input type="time" name="start" value="${esc(e.start||"")}"></label></div>
    <div class="two"><label class="fld"><span>Ends (blank = same day)</span><input type="date" name="enddate" value="${esc(endDate)}"></label>
      <label class="fld tm"><span>End time</span><input type="time" name="end" value="${esc(e.end||"")}"></label></div>
    <label class="fld"><span>Location</span><input name="location" value="${esc(e.location||"")}" placeholder="Add a place"></label>
    ${recurFields(e.repeat, date)}
    <div class="two"><label class="fld"><span>Reminder</span><select name="remind">${REMIND.map(([v,l]) => `<option value="${v}" ${String(e.remind ?? "")===v?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="fld"><span>Show as</span><select name="show">${Object.entries(SHOW).map(([k,l]) => `<option value="${k}" ${(e.show||"busy")===k?"selected":""}>${l}</option>`).join("")}</select></label></div>
    <label class="fld"><span>Notes</span><textarea name="note">${esc(e.note||"")}</textarea></label>
    <div class="sub" style="margin:-4px 0 10px">Reminders pop up while Base is open.${id && e.start ? ` For a phone notification, <a class="link" style="padding:0" target="_blank" rel="noopener" href="${gcalLink(e.title, date, e.start, 0, e.note, e.end)}">add it to Google Calendar ↗</a>` : ""}</div>`,
    f => {
      const title = f.title.value.trim(); if (!title) return "Give it a title."; if (!f.date.value) return "Pick a start date.";
      const ad = f.allday.checked || !f.start.value;
      const d0 = f.date.value, ed = f.enddate.value && f.enddate.value > d0 ? f.enddate.value : null;
      if (!ad && !ed && f.end.value && f.end.value < f.start.value) return "End time is before the start time.";
      const rep = readRecur(f, d0); if (typeof rep === "string") return rep;
      const body = {title, cat: f.cat.value, tags: f.tags.value.split(",").filter(Boolean), allDay: ad, date: d0, endDate: ed,
        start: ad ? null : f.start.value, end: ad ? null : (f.end.value || null), location: f.location.value.trim(),
        repeat: rep, remind: f.remind.value === "" ? null : Number(f.remind.value), show: f.show.value, note: f.note.value};
      if (isSeries && f.scope.value === "one"){
        put(id, {...src, ex: [...new Set([...(src.ex || []), occ])]}, {silent: true});
        put(uid(), {kind:"event", created: Date.now(), ...body, repeat: null, ex: []});
        return;
      }
      if (isSeries){ // whole series: keep the original first date unless the user moved it
        if (d0 === occ){ body.date = src.date; body.endDate = ed ? addDays(src.date, dIdx(ed) - dIdx(d0)) : null; }
        countEnd.clear();
      }
      const nid = id || uid();
      put(nid, {...(src || {kind:"event", created: Date.now()}), ...body, ex: isSeries || (src && src.repeat) ? (src.ex || []) : []});
    },
    id ? () => {
      if (!isSeries){ confirmSheet("Delete this event?", "This can't be undone.", () => del(id)); return; }
      sheet("Delete repeating event", `<div class="sub" style="margin-bottom:12px">${esc(e.title)} · ${esc(repeatText(e.repeat, e.date))}</div>
        <div class="chips"><button type="button" class="btn" data-del-one>Only ${esc(fmtDay(occ))}</button><button type="button" class="btn danger" data-del-all>The whole series</button></div>`, () => {}, null, "Cancel");
      const S = $(".sheet");
      S.querySelector("[data-del-one]").onclick = () => { put(id, {...items[id], ex: [...new Set([...(items[id].ex || []), occ])]}); $(".scrim")?.remove(); };
      S.querySelector("[data-del-all]").onclick = () => { del(id); $(".scrim")?.remove(); };
    } : null);
  // dynamic fields
  const S = $(".sheet"), F = S.querySelector("form") || S;
  wireRecur(F, "date");
  const sync = () => { const ad = F.querySelector("[name=allday]").checked; S.querySelectorAll(".tm").forEach(x => x.style.visibility = ad ? "hidden" : ""); };
  F.querySelector("[name=allday]").addEventListener("change", sync);
  sync();
}

function gcalLink(title, date, time, mins, details, end){
  const s = date.replace(/-/g,"") + "T" + time.replace(":","") + "00";
  let e;
  if (end) e = date.replace(/-/g,"") + "T" + end.replace(":","") + "00";
  else { const d = parse(date); const [h,m] = time.split(":").map(Number); d.setHours(h, m + (mins || 30)); e = ymd(d).replace(/-/g,"") + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00"; }
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) + "&dates=" + s + "/" + e + "&details=" + encodeURIComponent(details || "");
}

/* ---------- generic sheet ---------- */
function sheet(title, inner, onSave, onDelete, saveLabel = "Save"){
  const L = $("#layer");
  const keepOv = L.querySelector(".ov");
  L.querySelectorAll(".scrim").forEach(s => s.remove());
  const sc = document.createElement("div"); sc.className = "scrim";
  sc.innerHTML = `<form class="sheet"><h3>${esc(title)}</h3>${inner}<div class="err" hidden></div>
    <div class="acts">${onDelete?`<button type="button" class="btn danger" data-del>Delete</button>`:""}<span class="sp"></span><button type="button" class="btn" data-cancel>Cancel</button><button class="btn pri">${esc(saveLabel)}</button></div></form>`;
  L.appendChild(sc);
  const f = sc.querySelector("form"), close = () => sc.remove();
  sc.onclick = e => { if (e.target === sc) close(); };
  f.querySelectorAll("[data-tagpick],[data-daypick]").forEach(tp => tp.onclick = ev => { const b = ev.target.closest("button[data-val]"); if (!b) return; b.classList.toggle("on");
    tp.nextElementSibling.value = [...tp.querySelectorAll("button.on")].map(x => x.dataset.val).join(","); });
  f.querySelectorAll("[data-seg]").forEach(sg => sg.onclick = ev => { const b = ev.target.closest("button[data-val]"); if (!b) return; sg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); sg.nextElementSibling.value = b.dataset.val;
    if (sg.dataset.seg === "cat"){ const tp = f.querySelector("[data-tagpick]"); if (tp){ const sel = tp.nextElementSibling.value.split(",").filter(id => { const t = tagById(id); return t && (t.cat === b.dataset.val || t.cat === "both"); }); tp.innerHTML = tagButtons(b.dataset.val, sel); tp.nextElementSibling.value = sel.join(","); } } });
  wireTagAdd(f);
  f.querySelector("[data-cancel]").onclick = close;
  if (onDelete) f.querySelector("[data-del]").onclick = () => { close(); onDelete(); };
  f.onsubmit = async e => { e.preventDefault(); const r = await onSave(f); if (typeof r === "string"){ const er = f.querySelector(".err"); er.textContent = r; er.hidden = false; return; } close(); };
  const firstInput = f.querySelector("input:not([type=date]):not([type=time]),textarea");
  if (firstInput && !firstInput.value) setTimeout(() => firstInput.focus(), 60);
  void keepOv;
}
function confirmSheet(title, msg, yes){ sheet(title, `<div class="sub">${esc(msg)}</div>`, () => { yes(); }, null, "Delete"); }

      const nz = Math.max(.25, Math.min(64, pinch.z * d / pinch.d)), mx = ((a[0] + b[0]) / 2 - r.left) * k, my = ((a[1] + b[1]) / 2 - r.top) * k, pmx = (pinch.mx - r.left) * k, pmy = (pinch.my - r.top) * k;
      S.panX = mx - (pmx - pinch.px) * nz / pinch.z; S.panY = my - (pmy - pinch.py) * nz / pinch.z; S.zoom = nz; redraw(); return; }

    if (S.tool === "pen" || S.tool === "erase"){ if (x === last[0] && y === last[1]) return; pxLine(S.data, last[0], last[1], x, y, col); last = [x, y]; redraw(); return; }
    if (["line", "rect", "ellipse"].includes(S.tool) && before){ const D = before.slice(); ({line: pxLine, rect: pxRect, ellipse: pxEllipse})[S.tool](D, start[0], start[1], x, y, col); S.data = D; redraw(); } };
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size){ start = null; before = null; } };
  cv.onpointerup = up; cv.onpointercancel = up;
  cv.onwheel = e => { e.preventDefault(); const r = cv.getBoundingClientRect(), k = dpr(), mx = (e.clientX - r.left) * k, my = (e.clientY - r.top) * k, nz = Math.max(.25, Math.min(64, S.zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
    S.panX = mx - (mx - S.panX) * nz / S.zoom; S.panY = my - (my - S.panY) * nz / S.zoom; S.zoom = nz; redraw(); };
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-px],[data-px-tool],[data-px-col],[data-px-open]"); if (!t) return; const S = pxState();
  if (t.dataset.pxOpen) return void pxOpen(t.dataset.pxOpen);
  if (t.dataset.pxTool){ S.tool = t.dataset.pxTool; return pxRender(); }

  const a = t.dataset.px, zoomBy = k => { const cv = document.getElementById("px-c"); if (!cv) return; const mx = cv.width / 2, my = cv.height / 2, nz = Math.max(.25, Math.min(64, S.zoom * k)); S.panX = mx - (mx - S.panX) * nz / S.zoom; S.panY = my - (my - S.panY) * nz / S.zoom; S.zoom = nz; pxDraw(); };

  if (a === "undo"){ if (S.hist.length){ S.fut.push(S.data); S.data = S.hist.pop(); pxDraw(); } return; }
  if (a === "redo"){ if (S.fut.length){ S.hist.push(S.data); S.data = S.fut.pop(); pxDraw(); } return; }
  if (a === "zin") return zoomBy(1.4);

  if (a === "custom"){ const w = parseInt((document.getElementById("px-cw") || {}).value), h = parseInt((document.getElementById("px-ch") || {}).value); if (!(w > 0 && h > 0)) return; return pxResize(w, h); }

/* ---------- render ---------- */
function render(){
  if (mode === "loading") return;
  renderNav();
  const a = document.activeElement, fid = a && a.id, val = a && a.value, ss = a && a.selectionStart, se = a && a.selectionEnd;
  let html;
  if (tab === "apps" && app){ const AV = {tasks: viewTasks, calendar: viewCalendar, goals: viewGoals, food: viewFoodApp, notes: viewNotes, journal: viewNotes, trends: viewTrends, pet: viewPet, pixel: viewPixel}[app]; html = (app === "goals" && goalOpen && items[goalOpen] ? "" : `<button class="link back" data-go="apps">‹ Apps</button>`) + AV(); }
  else html = ({today: viewToday, apps: viewApps, settings: viewSettings}[tab] || viewToday)();
  $("#app").innerHTML = html;
  if (fid){ const el = document.getElementById(fid); if (el){ if (val != null && fid !== "journal" && el.type !== "time") el.value = val; el.focus(); try { el.setSelectionRange(ss, se); } catch {} } }
  const jr = $("#journal");
  if (jr) journalInput("journal-" + viewDay, viewDay, jr, e => { const a = $("#jtime"), b = $("#jno"); if (a) a.textContent = jTimes(e); if (b) b.textContent = "Journal Entry #" + pad3(e.n); });
  const wn = $("#water-num");
  if (wn) wn.onchange = () => { setWater(viewDay, Math.max(0, Number(wn.value) || 0)); };
  const eq = $("#ev-q");
  if (eq){ eq.oninput = () => { evQuery = eq.value; render(); }; }
  const nq = $("#note-q");
  if (nq){ nq.oninput = () => { noteQuery = nq.value; render(); }; }
  wireCharts();
  if (tab === "apps" && app === "pixel") mountPixel();
  wireKit();
  const sb = $("#sleep-bed"), sw = $("#sleep-wake");
  if (sb && sw){ const upd = () => { const s = {...(dayDoc(viewDay).sleep||{})}; s.bed = sb.value || null; s.wake = sw.value || null; setDay(viewDay, {sleep: s}); }; sb.onchange = upd; sw.onchange = upd; }
  const vf = $("#vault-file");
  if (vf){ vf.onchange = () => { const file = vf.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => { const html = String(rd.result); if (saveHtml(uid(), titleFromHtml(html, file.name.replace(/\.html?$/i,"")), html)) toast("Saved to your vault."); }; rd.readAsText(file); vf.value = ""; }; }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {

  if (d.gstepDel){ const g = items[goalOpen]; if (g) put(goalOpen, {...g, steps: (g.steps||[]).filter(x => x.id !== d.gstepDel)}); return; }
  if (d.glogDel){ const g = items[goalOpen]; if (g) put(goalOpen, {...g, log: (g.log||[]).filter(x => x.id !== d.glogDel)}); return; }
  if (d.calview){ calView = d.calview; agendaDays = 14; render(); return; }
  if (d.weeknav){ calSel = addDays(calSel, Number(d.weeknav)); calMonth = calSel.slice(0,7); render(); return; }
  if (d.tagDel){ const ts = tags(); saveCfg({tags: ts.filter(t => t.id !== d.tagDel)}); if (catFilter === d.tagDel) catFilter = "all"; return; }
  if (d.plan){ togglePlanned(d.planDay || viewDay, d.plan); return; }
  if (d.repeat){ repeatSheet(d.repeat); return; }
  if (d.foodtab){ foodTab = d.foodtab; window.scrollTo(0,0); render(); return; }

  if (d.foodEdit){ foodEntrySheet(null, d.foodEdit); return; }
  if (d.foodDel){ const dd = dayDoc(foodDay || today()); setDay(foodDay || today(), {eats: (dd.eats || []).filter(x => x.id !== d.foodDel)}); return; }
  if (d.foodItem){ foodItemSheet(d.foodItem); return; }
  if (d.foodSex){ saveFood({sex: d.foodSex}); return; }
  if (d.foodAct){ saveFood({act: d.foodAct}); return; }
  if (d.foodGoal){ saveFood({goal: d.foodGoal}); return; }
  if (d.themePick){ applyTheme(d.themePick); applyKit(); render(); return; }
  if (d.kitOn !== undefined){ const k = {...kitState(), on: el.checked}; kitSave(k); applyKit(k); render(); return; }
  if (d.kitPreset !== undefined){ const p = KIT_PRESETS[+d.kitPreset]; const k = {...kitState(), h: p.h, s: p.s, depth: p.depth, bright: p.bright, on: true}; kitSave(k); applyKit(k); render(); return; }

  if (d.kitReset !== undefined){ kitSave({...KIT_DEF}); applyKit(); render(); return; }

    else if (k === "journal") saveCfg({journalOn: on}); else if (k === "goals") saveCfg({goalsOn: on}); else if (k === "pet") saveCfg({pet: {...((items.settings || {}).pet || {}), on}}); else if (k === "agenda") saveCfg({agendaOn: on}); return; }

  if (d.habDel){ put(d.habDel, {...items[d.habDel], archived:true}); return; }

  if (d.meal){ const m = {...(dayDoc(viewDay).meals||{})}; m[d.meal] = !m[d.meal]; setDay(viewDay, {meals: m}); return; }
  if (d.food){ const cur = dayDoc(viewDay).food; setDay(viewDay, {food: cur === d.food ? null : d.food}); return; }

document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === "goallog"){ const v = Number($("#gl-val").value); if ($("#gl-val").value === "" || isNaN(v)) return; addGoalLog(goalOpen, v, $("#gl-date").value || today(), $("#gl-note").value.trim()); toast("Logged."); return; }

  if (f.dataset.form === "newhab"){ const max = Math.max(0, ...habitsList().map(h => h.order||0)); inp.value = ""; put(uid(), {kind:"habit", title, order:max+1, created:Date.now()}); const a = $("#new-hab"); if (a) a.focus(); return; }
  if (f.dataset.form === "newtag"){ const ts = tags(), cc = (items.settings||{}).catColors || {}; inp.value = ""; const used = [...ts.map(t => t.c), cc.work ?? 0, cc.life ?? 1]; let c = 0; while (used.includes(c) && c < 7) c++; const pc = $("#new-tag-col"); if (pc && pc.dataset.touched) c = +pc.value; saveCfg({tags: [...ts, {id: uid(), name: title, c, cat: ($("#new-tag-cat") || {}).value || "life"}]}); const a = $("#new-tag"); if (a) a.focus(); return; }
  if (f.dataset.form === "newmeal"){ const c = cfg(); inp.value = ""; saveCfg({mealsCfg: {...c.meals, list: [...c.meals.list, {id: uid(), name: title}]}}); const a = $("#new-meal"); if (a) a.focus(); return; }
  let due = today();
  if (f.dataset.form === "quick-task") due = quickDue === "today" ? today() : quickDue === "tomorrow" ? addDays(today(),1) : null;
  inp.value = "";
  put(uid(), {kind:"task", title, due, time:null, notes:"", cat: f.dataset.form === "quick-task" ? defCat() : "life", tags: [], done:false, created:Date.now()});
  const again = document.getElementById(inp.id); if (again) again.focus();
});

// in-app reminders
const fired = new Set((() => { try { return JSON.parse(sessionStorage.getItem("base-fired") || "[]"); } catch { return []; } })());
function checkReminders(){
  const now = Date.now(), t = today();
  for (const d of [t, addDays(t, 1)]) for (const e of eventsFor(d)){
    if (e.remind == null || e.dayN > 0) continue;
    const [y, m, dd] = e.occ.split("-").map(Number), [hh, mm] = (e.allDay || !e.start ? "09:00" : e.start).split(":").map(Number);
    const at = new Date(y, m-1, dd, hh, mm).getTime(), key = e.id + "@" + e.occ;
    if (now >= at - e.remind * 60000 && now < at + 5 * 60000 && !fired.has(key)){
      fired.add(key); try { sessionStorage.setItem("base-fired", JSON.stringify([...fired])); } catch {}
      showAlert(e, at);
    }
  }
}
function showAlert(e, at){
  const mins = Math.round((at - Date.now()) / 60000);
  const el = document.createElement("div"); el.className = "alertbar";
  el.innerHTML = `<span>🔔</span><div class="grow"><b>${esc(e.title)}</b><div>${mins > 1 ? `In ${mins >= 120 ? Math.round(mins/60) + " hours" : mins + " minutes"}` : "Starting now"}${e.allDay||!e.start ? "" : " · " + fmtTime(e.start)}${e.location ? " · " + esc(e.location) : ""}</div></div><button class="btn sm">OK</button>`;
  el.querySelector("button").onclick = () => el.remove();
  document.body.appendChild(el);
}
setInterval(checkReminders, 30000);
setTimeout(checkReminders, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkReminders(); });

// refresh "today" when the app comes back after midnight
let lastDay = today();
document.addEventListener("visibilitychange", () => { if (!document.hidden && today().slice(0,7) !== lastDay.slice(0,7)) { prompted = false; maybePromptBackup(); }
  if (!document.hidden && today() !== lastDay){ if (viewDay === lastDay) viewDay = today(); lastDay = today(); render(); } });

init();
})();
